name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows x64
    runs-on: windows-latest
    environment:
      name: windows-packaging
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version must use MAJOR.MINOR.PATCH format."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Botmux plugin
        working-directory: botmux-skill
        run: npm test

      - name: Build portable application
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $versionTuple = (($env:APP_VERSION -split '\.') + '0') -join ', '
          $versionInfo = Get-Content "packaging/windows/version_info.txt" -Raw
          $versionInfo = $versionInfo -replace '\(\d+,\s*\d+,\s*\d+,\s*0\)', "($versionTuple)"
          $versionInfo = $versionInfo -replace "u'\d+\.\d+\.\d+'", "u'$env:APP_VERSION'"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $versionInfo | Set-Content -Encoding utf8 "build/windows-version-info.txt"

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name Seele `
            --icon exe.ico `
            --version-file build/windows-version-info.txt `
            --contents-directory . `
            --collect-all qt_material `
            --add-data "audio;audio" `
            --add-data "image;image" `
            --add-data "botmux-skill;botmux-skill" `
            --add-data "audio_name_dic.json;." `
            --add-data "botmux_config.example.json;." `
            --add-data "bubble_texts.json;." `
            --add-data "config.json;." `
            --add-data "file_name.json;." `
            --add-data "state.json;." `
            --add-data "uid.json;." `
            --add-data "README.md;." `
            --add-data "CHANGELOG.md;." `
            --add-data "DEVELOPMENT_LOG.md;." `
            --add-data "MAC_BYTE_AUTO_INSTALL_COMMANDS.md;." `
            --add-data "MAC_BYTE_ZERO_TOUCH_RESEARCH.md;." `
            --add-data "EDITION;." `
            --add-data "VERSION;." `
            --add-data "LICENSE;." `
            run_exe.py
          if (-not (Test-Path "dist/Seele/Seele.exe")) {
            throw "PyInstaller did not produce dist/Seele/Seele.exe"
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          & "dist/Seele/Seele.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Windows application smoke test failed."
          }

      - name: Build installer and checksums
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive `
            -Path "dist/Seele" `
            -DestinationPath "release/Seele-$env:APP_VERSION-windows-x64-portable.zip" `
            -CompressionLevel Optimal

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "packaging\windows\Seele.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $manifest = @{
            product = "Seele"
            version = $env:APP_VERSION
            commit = $env:GITHUB_SHA
            platform = "windows-x64"
            built_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json
          $manifest | Set-Content -Encoding utf8 "release/release-manifest-windows.json"

          Get-ChildItem release -File |
            Where-Object { $_.Name -ne "SHA256SUMS-windows.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii "release/SHA256SUMS-windows.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Seele-${{ steps.version.outputs.version }}-windows
          path: release/*
          if-no-files-found: error

  package-mac-byte:
    name: Package mac_byte arm64
    runs-on: macos-14
    environment:
      name: mac-byte-packaging
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Botmux plugin
        working-directory: botmux-skill
        run: npm test

      - name: Build macOS icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Seele.iconset
          cp image/bs_icon.png build/icon-source.png
          sips --cropToHeightWidth 452 452 build/icon-source.png --out build/icon-square.png >/dev/null
          sips -z 16 16 build/icon-square.png --out build/Seele.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 build/icon-square.png --out build/Seele.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 build/icon-square.png --out build/Seele.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 build/icon-square.png --out build/Seele.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 build/icon-square.png --out build/Seele.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 build/icon-square.png --out build/Seele.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 build/icon-square.png --out build/Seele.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 build/icon-square.png --out build/Seele.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 build/icon-square.png --out build/Seele.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 build/icon-square.png --out build/Seele.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns build/Seele.iconset -o build/Seele.icns

      - name: Build and smoke-test mac_byte app
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/coach-spec
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --console \
            --name SeeleBotmuxCoach \
            --distpath build/coach-dist \
            --workpath build/coach-work \
            --specpath build/coach-spec \
            botmux_setup_coach_entry.py

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name Seele \
            --icon build/Seele.icns \
            --osx-bundle-identifier com.xinna2001.seele.mac-byte \
            --contents-directory . \
            --collect-all qt_material \
            --add-data "audio:audio" \
            --add-data "image:image" \
            --add-data "botmux-skill:botmux-skill" \
            --add-data "audio_name_dic.json:." \
            --add-data "botmux_config.example.json:." \
            --add-data "bubble_texts.json:." \
            --add-data "config.json:." \
            --add-data "file_name.json:." \
            --add-data "state.json:." \
            --add-data "uid.json:." \
            --add-data "README.md:." \
            --add-data "CHANGELOG.md:." \
            --add-data "DEVELOPMENT_LOG.md:." \
            --add-data "MAC_BYTE_AUTO_INSTALL_COMMANDS.md:." \
            --add-data "MAC_BYTE_ZERO_TOUCH_RESEARCH.md:." \
            --add-data "EDITION:." \
            --add-data "VERSION:." \
            --add-data "LICENSE:." \
            run_exe.py

          mkdir -p "dist/Seele.app/Contents/Resources/bin"
          cp "build/coach-dist/SeeleBotmuxCoach" \
            "dist/Seele.app/Contents/Resources/bin/SeeleBotmuxCoach"
          chmod 755 "dist/Seele.app/Contents/Resources/bin/SeeleBotmuxCoach"
          script -q /dev/null \
            env "SEELE_RESOURCES_DIR=$PWD/dist/Seele.app/Contents/Resources" \
            "dist/Seele.app/Contents/Resources/bin/SeeleBotmuxCoach" \
            /usr/bin/true </dev/null

          plist="dist/Seele.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$plist" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_VERSION" "$plist" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $APP_VERSION" "$plist"
          codesign --force --deep --sign - "dist/Seele.app"
          codesign --verify --deep --strict --verbose=2 "dist/Seele.app"
          QT_QPA_PLATFORM=offscreen "dist/Seele.app/Contents/MacOS/Seele" --smoke-test
          "dist/Seele.app/Contents/MacOS/Seele" --botmux-coach-smoke-test

      - name: Build mac_byte DMG, ZIP, and checksums
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          zip_path="release/Seele-${APP_VERSION}-mac_byte-macos-arm64.zip"
          dmg_path="release/Seele-${APP_VERSION}-mac_byte-macos-arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "dist/Seele.app" "$zip_path"
          hdiutil create \
            -volname "Seele ${APP_VERSION} mac_byte" \
            -srcfolder "dist/Seele.app" \
            -ov \
            -format UDZO \
            "$dmg_path"

          # Keep stable aliases so documentation can point at GitHub's
          # /releases/latest/download/ URL without embedding a version number.
          cp "$zip_path" "release/Seele-mac_byte-macos-arm64.zip"
          cp "$dmg_path" "release/Seele-mac_byte-macos-arm64.dmg"

          cat > release/release-manifest-mac_byte.json <<EOF
          {
            "product": "Seele",
            "version": "${APP_VERSION}",
            "edition": "mac_byte",
            "commit": "${GITHUB_SHA}",
            "platform": "macos-arm64",
            "signed": "ad-hoc",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          (
            cd release
            shasum -a 256 \
              "Seele-${APP_VERSION}-mac_byte-macos-arm64.zip" \
              "Seele-${APP_VERSION}-mac_byte-macos-arm64.dmg" \
              Seele-mac_byte-macos-arm64.zip \
              Seele-mac_byte-macos-arm64.dmg \
              release-manifest-mac_byte.json \
              > SHA256SUMS-mac_byte.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: Seele-${{ steps.version.outputs.version }}-mac_byte
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [package-windows, package-mac-byte]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Seele-${{ needs.package-windows.outputs.version }}-windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Seele-${{ needs.package-mac-byte.outputs.version }}-mac_byte
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package-windows.outputs.version }}
        run: |
          tag="v${VERSION}"
          notes="## Seele ${VERSION}

          这是 Seele 的正式封装版本，保留桌面宠物、语音输入、影刀 RPA 与 Botmux 插件能力。

          ### 本版新增

          - 新增「任务面板」：桌宠右键菜单打开独立窗口，展示最近 24 小时内有活动的 Botmux 任务（最初发起者、会话、机器人、标题、状态、相对活动时间），点击任意任务直接跳转到对应飞书话题。
          - 任务状态归纳为「进行中 / 等你回复 / 空闲」三类，仅接受 applink.feishu.cn 深链跳转。
          - 桌宠自动发现本机 Botmux Dashboard（读取 ~/.botmux 的端口与读取令牌），无需随包附带配置即可连通。
          - 右键菜单改为圆角、品牌蓝悬停的统一视觉。

          ### mac_byte 安装

          - Node.js、npm、tmux、Trae CLI、Lark CLI、AgentBuddy 和 Botmux 独立检测，已有兼容组件不重复安装。
          - Trae CLI 额外校验 backend cn 能力；旧版本命令虽存在但能力不兼容时自动升级并复核。
          - tmux 缺失时自动通过已有 Homebrew 安装；Homebrew 缺失时先运行官方安装器。
          - Homebrew 首次安装出现管理员密码提示时播放语音说明；密码仍由用户直接输入且不会被记录。
          - Homebrew 官方回车确认和明确的 Y/N 选择由 PTY helper 自动处理，未知提示保持人工确认。
          - Trae CLI、Lark CLI 和 AgentBuddy 在本人授权后自动校验并继续。
          - Lark CLI 应用初始化每轮只执行一次，并以本机配置读回作为成功判据；未落盘时提示重启续跑。
          - Botmux 根据当前真实提示播放语音，固定自动选择 traex 和默认工作目录。
          - Botmux setup 自动处理创建新应用、重新扫码、返回应用来源和中国飞书租户等确定性选项；身份、名称、邮箱和凭证仍由用户处理。
          - macOS 安装包固定从 Contents/Resources 启动 Botmux coach，并在发布前执行包内路径自检。
          - 普通登录语音与浏览器授权并行；旧记录后台清理，链接超时或失败时才前置 Terminal。
          - Botmux 交互配置继续前置 Terminal，保留名称、邮箱和菜单操作入口。
          - 登录命令输出 HTTPS 授权地址后自动优先使用 Google Chrome 打开。
          - 桌宠透明 GIF 使用整面 alpha 替换绘制，减少低性能机型的上一帧虚影。
          - “换个角色”和音色说明窗口按屏幕可用区域自适应尺寸，支持小屏纵排，并提供可见关闭按钮。
          - 安装过程不使用固定等待秒数，不再要求阶段间手动按回车。

          ### 下载

          - \`Seele-${VERSION}-windows-x64-setup.exe\`：Windows 安装版
          - \`Seele-${VERSION}-windows-x64-portable.zip\`：Windows 便携版
          - \`Seele-${VERSION}-mac_byte-macos-arm64.dmg\`：字节内部 Apple Silicon 安装版
          - \`Seele-${VERSION}-mac_byte-macos-arm64.zip\`：字节内部 Apple Silicon 压缩包
          - \`Seele-mac_byte-macos-arm64.dmg\` / \`.zip\`：供文档长期引用、始终指向当前 Release 的稳定文件名
          - \`SHA256SUMS-*.txt\`：文件完整性校验

          ### 说明

          当前 Windows 安装包尚未配置商业代码签名证书，首次运行时 Windows 可能显示 SmartScreen 提示。mac_byte 包使用 ad-hoc 签名，仅面向字节内部测试。"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Seele ${VERSION}" \
              --notes "$notes"
          fi
